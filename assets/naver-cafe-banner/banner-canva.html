<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SSUMSS 네이버 카페 메뉴 배너 (블랙)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#5a5a5a;}
  .page{
    width:340px;height:200px;
    background:#111111;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    font-family:'Jost','Helvetica Neue',Arial,sans-serif;
    box-sizing:border-box;
  }
  .wordmark{
    color:#ffffff;
    font-weight:400;
    font-size:46px;
    letter-spacing:19px;
    text-indent:19px;
    line-height:1;
    margin:0;
    white-space:nowrap;
  }
  .divider{
    width:68px;height:2px;background:#ffffff;opacity:.8;
    margin:22px 0;border:0;
  }
  .cta{
    color:#b7b7b7;
    font-weight:400;
    font-size:16px;
    letter-spacing:9px;
    text-indent:9px;
    margin:0;
    white-space:nowrap;
  }
</style>
</head>
<body>
  <!-- data-document-role="page" tells Canva to import this block as one editable page -->
  <div class="page" data-document-role="page" data-label="SSUMSS 메뉴 배너">
    <p class="wordmark">SSUMSS</p>
    <hr class="divider">
    <p class="cta">바로가기</p>
  </div>
</body>
</html>
