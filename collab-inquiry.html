<style>
/* ===== KSUPA 협업문의 위젯 (간편형) ===== */
.ks-collab *{box-sizing:border-box;margin:0;padding:0;}
.ks-collab{
  --blue:#0e86c4; --blue-d:#0a6294; --navy:#082f4a; --sky:#29abe2;
  --red:#ed1c24; --red-d:#c8151c; --tint:#e8f6fc; --line:#e2ebf1; --muted:#5a6b76; --ink:#12222e;
  font-family:Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink); line-height:1.6; word-break:keep-all; max-width:560px; margin:0 auto;
}
/* intro */
.ks-collab .kc-hero{
  color:#eaf6ff; border-radius:20px 20px 0 0; padding:32px 30px 28px;
  background:radial-gradient(500px 220px at 85% -20%,#29abe2 0,transparent 60%),
    linear-gradient(155deg,#082f4a 0%,#0a6294 60%,#0a6294 120%);
}
.ks-collab .kc-eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:#9bd7f2;}
.ks-collab .kc-hero h2{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:9px 0 10px;color:#fff;}
.ks-collab .kc-hero p{font-size:14px;color:#cfe8f5;font-weight:500;}
.ks-collab .kc-hero p b{color:#fff;}

/* form */
.ks-collab form{background:#fff;border:1px solid var(--line);border-top:0;
  border-radius:0 0 20px 20px;padding:26px 30px 28px;box-shadow:0 14px 40px rgba(8,47,74,.08);}
.ks-collab .kc-field{margin-bottom:18px;}
.ks-collab .kc-label{display:block;font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:9px;}
.ks-collab .kc-label .req{color:var(--red);margin-left:3px;}
.ks-collab .kc-label .opt{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px;}
.ks-collab input[type=text],.ks-collab textarea{
  width:100%;font:inherit;font-size:15px;color:var(--ink);background:#fff;
  border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;transition:.15s;}
.ks-collab textarea{min-height:88px;resize:vertical;}
.ks-collab input:focus,.ks-collab textarea:focus{
  outline:0;border-color:var(--blue);box-shadow:0 0 0 3px rgba(14,134,196,.14);}

/* 관심 분야 chips */
.ks-collab .kc-types{display:flex;flex-wrap:wrap;gap:8px;}
.ks-collab .kc-types label{cursor:pointer;user-select:none;}
.ks-collab .kc-types input{position:absolute;opacity:0;width:0;height:0;}
.ks-collab .kc-types span{display:inline-block;font-size:13px;font-weight:600;color:var(--blue-d);
  background:var(--tint);border:1.5px solid transparent;border-radius:999px;padding:8px 14px;transition:.15s;}
.ks-collab .kc-types label:hover span{border-color:#bfe0ef;}
.ks-collab .kc-types input:checked + span{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(14,134,196,.30);}
.ks-collab .kc-types input:focus-visible + span{box-shadow:0 0 0 3px rgba(14,134,196,.30);}

/* 동의 */
.ks-collab .kc-agree{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--muted);}
.ks-collab .kc-agree input{width:17px;height:17px;accent-color:var(--blue);flex:0 0 auto;}
.ks-collab .kc-agree a{color:var(--blue-d);font-weight:700;text-decoration:underline;}

/* submit */
.ks-collab .kc-submit{width:100%;font:inherit;font-size:16px;font-weight:800;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--red),var(--red-d));border:0;border-radius:13px;padding:16px;margin-top:4px;
  box-shadow:0 10px 24px rgba(237,28,36,.30);transition:.18s;}
.ks-collab .kc-submit:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(237,28,36,.40);}
.ks-collab .kc-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.ks-collab .kc-alt{text-align:center;font-size:12.5px;color:var(--muted);margin-top:15px;}
.ks-collab .kc-alt b{color:var(--navy);}

/* success */
.ks-collab .kc-msg{display:none;text-align:center;padding:42px 24px;}
.ks-collab .kc-msg .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
  font-size:30px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--sky));}
.ks-collab .kc-msg h3{font-size:21px;font-weight:800;color:var(--navy);margin-bottom:8px;}
.ks-collab .kc-msg p{font-size:14.5px;color:var(--muted);}
.ks-collab.sent form{display:none;}
.ks-collab.sent .kc-msg{display:block;}
</style>

<div class="ks-collab">
  <!-- ===== 안내글 ===== -->
  <div class="kc-hero">
    <div class="kc-eyebrow">PARTNERSHIP WITH KSUPA</div>
    <h2>가볍게 문을 두드려 주세요 🖐</h2>
    <p>단체 강습·이벤트·지부 설립·브랜드 제휴·강사 파견 등 <b>어떤 협업이든 환영</b>합니다. 연락처만 남겨주시면 담당자가 <b>1~2일 내</b> 연락드려 자세한 내용을 함께 조율해 드릴게요. 부담 없이 시작하세요!</p>
  </div>

  <!-- ===== 간편 폼 =====
       action 값을 발급받은 폼 엔드포인트(Formspree 등)로 교체하세요. -->
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" novalidate>
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px;">
    <input type="hidden" name="_subject" value="[KSUPA] 새 협업 문의가 접수되었습니다">

    <div class="kc-field">
      <label class="kc-label">어떤 협업인가요? <span class="opt">선택 · 눌러서 표시</span></label>
      <div class="kc-types">
        <label><input type="checkbox" name="관심분야" value="단체·기업 강습"><span>단체·기업 강습</span></label>
        <label><input type="checkbox" name="관심분야" value="이벤트 협력"><span>이벤트 협력</span></label>
        <label><input type="checkbox" name="관심분야" value="아카데미 지부 설립"><span>지부 설립</span></label>
        <label><input type="checkbox" name="관심분야" value="브랜드 제휴·협찬"><span>브랜드 제휴·협찬</span></label>
        <label><input type="checkbox" name="관심분야" value="광고·스폰서십"><span>광고·스폰서십</span></label>
        <label><input type="checkbox" name="관심분야" value="강사 파견·채용"><span>강사 파견</span></label>
        <label><input type="checkbox" name="관심분야" value="기타"><span>기타</span></label>
      </div>
    </div>

    <div class="kc-field">
      <label class="kc-label">성함 · 소속 <span class="req">*</span></label>
      <input type="text" name="성함소속" placeholder="홍길동 · (주)패들컴퍼니" required>
    </div>

    <div class="kc-field">
      <label class="kc-label">연락처 <span class="req">*</span></label>
      <input type="text" name="연락처" placeholder="휴대폰 번호 또는 이메일 주소" required>
    </div>

    <div class="kc-field">
      <label class="kc-label">남기실 말씀 <span class="opt">선택</span></label>
      <textarea name="내용" placeholder="한 줄이면 충분해요. 예) 회사 워크샵으로 단체 SUP 강습 문의드립니다."></textarea>
    </div>

    <div class="kc-field">
      <label class="kc-agree">
        <input type="checkbox" name="개인정보동의" value="동의" required>
        <span><a href="#" target="_blank" rel="noopener">개인정보 수집·이용</a>에 동의합니다. (연락 목적, 처리 후 1년 보관)</span>
      </label>
    </div>

    <button type="submit" class="kc-submit">협업 문의 보내기 →</button>
    <div class="kc-alt">카카오톡 채널 <b>@KSUPA</b> · <b>jflafit@gmail.com</b> 으로도 편하게 연락 주세요.</div>
  </form>

  <div class="kc-msg">
    <div class="ic">✓</div>
    <h3>잘 접수되었습니다!</h3>
    <p>문을 두드려 주셔서 감사합니다.<br>1~2일 내 담당자가 연락드릴게요.</p>
  </div>
</div>

<script>
(function(){
  var root=document.querySelector('.ks-collab');
  var form=root.querySelector('form');
  var btn=form.querySelector('.kc-submit');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    if(!form.checkValidity()){ form.reportValidity(); return; }
    btn.disabled=true; btn.textContent='보내는 중…';
    try{
      var res=await fetch(form.action,{method:'POST',body:new FormData(form),headers:{'Accept':'application/json'}});
      if(res.ok){ root.classList.add('sent'); window.scrollTo({top:root.offsetTop-20,behavior:'smooth'}); }
      else{ throw new Error('fail'); }
    }catch(err){
      btn.disabled=false; btn.textContent='협업 문의 보내기 →';
      alert('전송에 실패했습니다. 잠시 후 다시 시도하시거나 jflafit@gmail.com 으로 보내주세요.');
    }
  });
})();
</script>
